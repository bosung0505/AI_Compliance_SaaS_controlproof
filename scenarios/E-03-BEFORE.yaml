schema_version: controlproof.scenario.v2
scenario_id: E-03
version: 2.0.0
execution_profile: E03_BEFORE_V2
fault_variant: BEFORE_RESULT_DURABLE
applicable_assertion_ids: [E03-A1, E03-A2, E03-A3, E03-A4, E03-A7, E03-A8]
title: 저장 전 장애의 누락 없는 reporting 복구
control_intent: >-
  리포트 내구 저장 전 장애 중 업무 효과가 생성되지 않고, 원 사건과 연결된 DLQ 건을
  안전하게 재전달한 뒤 report·assistant retrieval projection·processed marker가 정확히
  한 논리 세트로 복구되는지 검증한다.

required_capabilities:
  target.version.read: v1
  target.environment.read: v1
  messaging.reporting.topology.read: v1
  messaging.reporting.attempts.read: v1
  messaging.reporting.dlq.read: v1
  messaging.reporting.dlq.redrive: v1
  reporting.fault.before.inject: v1
  reporting.fault.boundary.read: v1
  reporting.fault.restore: v1
  reporting.effects.read: v1
  reporting.model.deterministic: v1
  h03.subject.seed: v1
  reporting.trigger: v1
  hiring.final_decision.replay: v1
  hiring.decision_effects.read: v1

preconditions:
  - {precondition_id: local-environment, kind: RUNNER, description: 로컬 고정 fixture 환경이다.}
  - {precondition_id: reporting-topology, kind: TARGET, description: reporting queue와 DLQ가 canonical 설정이다.}
  - {precondition_id: before-boundary, kind: TARGET, description: BEFORE 장애 경계를 독립 영수증으로 관찰할 수 있다.}

steps:
  - {step_id: capture-environment, phase: BASELINE, action: target.environment.read, outputs: [environment.snapshot], evidence_requirements: [EV2-01]}
  - {step_id: capture-topology, phase: BASELINE, action: messaging.reporting.topology.read, outputs: [queue.topology], evidence_requirements: [EV2-01]}
  - {step_id: seed-pending-report, phase: BASELINE, action: h03.subject.seed, outputs: [], evidence_requirements: []}
  - {step_id: apply-before-fault, phase: INJECTED, action: reporting.fault.before.inject, outputs: [fault.marker.applied], evidence_requirements: [EV2-03]}
  - {step_id: trigger-reporting, phase: INJECTED, action: reporting.trigger, outputs: [source.event.id], evidence_requirements: [EV2-02]}
  - {step_id: read-before-boundary, phase: INJECTED, action: reporting.fault.boundary.read, outputs: [fault.boundary], evidence_requirements: [EV2-03]}
  - {step_id: read-attempts, phase: INJECTED, action: messaging.reporting.attempts.read, outputs: [delivery.attempts], evidence_requirements: [EV2-04]}
  - {step_id: read-terminal-failure, phase: INJECTED, action: messaging.reporting.dlq.read, outputs: [terminal.failure], evidence_requirements: [EV2-05]}
  - {step_id: read-injected-effects, phase: INJECTED, action: reporting.effects.read, outputs: [reporting.effects.injected], evidence_requirements: [EV2-10]}
  - {step_id: restore-marker, phase: RECOVERED, action: reporting.fault.restore, outputs: [fault.environment.restore], evidence_requirements: [EV2-09], always_run: true}
  - {step_id: redrive-failure, phase: RECOVERED, action: messaging.reporting.dlq.redrive, outputs: [redrive.receipt], evidence_requirements: [EV2-09], always_run: true}
  - {step_id: read-recovered-effects, phase: RECOVERED, action: reporting.effects.read, outputs: [reporting.effects.recovered], evidence_requirements: [EV2-10]}
  - {step_id: replay-human-decision, phase: RECOVERED, action: hiring.final_decision.replay, outputs: [decision.replay], evidence_requirements: [EV2-11]}

assertions:
  - {assertion_id: E03-A1, description: 원 사건부터 복구 효과까지 처리 계보가 완전하다., expectation: {lineage_complete: true}, required_observation_keys: [source.event.id, delivery.attempts, terminal.failure, reporting.effects.recovered], required_evidence_ids: [EV2-02, EV2-04, EV2-05, EV2-10], source_requirements: [FR-041]}
  - {assertion_id: E03-A2, description: 재시도 한도와 실제 시도 및 최종 DLQ 전이가 일치한다., expectation: {attempts: 3, terminal_failure: PRESENT}, required_observation_keys: [delivery.attempts, terminal.failure], required_evidence_ids: [EV2-01, EV2-04, EV2-05], source_requirements: [FR-041]}
  - {assertion_id: E03-A3, description: BEFORE 장애 중 reporting 내구 효과가 0건이다., expectation: {durable_effects: 0}, required_observation_keys: [fault.boundary, reporting.effects.injected], required_evidence_ids: [EV2-03, EV2-10], source_requirements: [FR-043]}
  - {assertion_id: E03-A4, description: 복구 후 reporting 필수 효과가 정확히 한 논리 세트다., expectation: {logical_report_count: 1, processed_count: 1}, required_observation_keys: [reporting.effects.recovered], required_evidence_ids: [EV2-10], source_requirements: [FR-044, FR-049, FR-050]}
  - {assertion_id: E03-A7, description: 복구 후 같은 사람 결정을 재전송해도 결정 효과가 한 세트다., expectation: {logical_decision_count: 1}, required_observation_keys: [decision.replay], required_evidence_ids: [EV2-11], source_requirements: [FR-051, FR-052, FR-053, FR-054, FR-055]}
  - {assertion_id: E03-A8, description: marker 해제와 안전한 redrive가 완료된다., expectation: {restore_safe: true}, required_observation_keys: [fault.environment.restore, redrive.receipt], required_evidence_ids: [EV2-09], source_requirements: [FR-072, FR-073]}

required_evidence:
  - {evidence_id: EV2-01, description: 환경과 queue topology, artifact_types: [VERSION_SNAPSHOT]}
  - {evidence_id: EV2-02, description: 원 Outbox event와 baseline, artifact_types: [STATE_SNAPSHOT]}
  - {evidence_id: EV2-03, description: BEFORE boundary receipt, artifact_types: [FAULT_RECEIPT]}
  - {evidence_id: EV2-04, description: delivery attempt 시계열, artifact_types: [STATE_SNAPSHOT]}
  - {evidence_id: EV2-05, description: terminal DLQ failure, artifact_types: [STATE_SNAPSHOT]}
  - {evidence_id: EV2-09, description: marker 복구와 redrive, artifact_types: [FAULT_RECEIPT]}
  - {evidence_id: EV2-10, description: injected와 recovered reporting 효과, artifact_types: [STATE_SNAPSHOT]}
  - {evidence_id: EV2-11, description: 사람 결정 최초 요청과 재전송 효과, artifact_types: [HTTP_EXCHANGE, STATE_SNAPSHOT]}
  - {evidence_id: EV2-12, description: 봉인된 profile snapshot, artifact_types: [VERSION_SNAPSHOT]}

timing_policy:
  poll_seconds: 2
  dlq_deadline_seconds: 360
  duplicate_ack_deadline_seconds: 60
  environment_restore_deadline_seconds: 180
  run_deadline_seconds: 600
  stability_consecutive: 3
  stability_seconds: 4
  expected_queue: {max_receive_count: 3, visibility_timeout_seconds: 5}

restore_policy:
  mandatory: true
  action: reporting.fault.restore
  report_processing_result_field: report.processing_recovery

observation_comparators: {}
source_requirements: [FR-041, FR-043, FR-044, FR-049, FR-050]
allowed_model_fixtures:
  h03-report-v1: ce09b95403b34e1390502c90f5c5edc518ddf65d38c8ce881617a37cac6d16b1
excluded_scope: [AWS]

scenario_id: H-03
version: 1.0.0
title: reporting 장애 시 결정 안전성
control_intent: >-
  사람의 최종 검토에 필요한 리포트가 준비되지 않으면 그 상태를 담당자에게
  드러내고, 명시적 이유와 함께 최종 채용 결정을 거부하며, 부분 변경이나
  자동 결정을 만들지 않고 시험 장애를 안전하게 복구한다.

required_capabilities:
  target.version.read: v1
  reporting.status.read: v1
  reporting.ui.observe: v1
  hiring.final_decision.attempt: v1
  hiring.state.read: v1
  hiring.decision_history.read: v1
  h03.subject.seed: v1
  reporting.trigger: v1
  reporting.fault.inject: v1
  reporting.fault.probe: v1
  reporting.fault.restore: v1
  reporting.model.deterministic: v1

preconditions:
  - precondition_id: target-reporting-present
    kind: TARGET
    description: WhyYou reporting 조회 및 생성 경로가 존재한다.
  - precondition_id: target-final-decision-present
    kind: TARGET
    description: COMPANY_USER 정상 최종결정 경로가 존재한다.
  - precondition_id: runner-fault-ready
    kind: RUNNER
    description: local/test 전용 장애 적용·발동 확인·복구 수단이 준비되어 있다.
  - precondition_id: runner-model-fixture-ready
    kind: RUNNER
    description: 허용된 고정 모델 fixture ID와 digest가 확인된다.

steps:
  - step_id: seed-pending-report
    phase: BASELINE
    action: h03.subject.seed
    outputs: []
    evidence_requirements: []
  - step_id: capture-baseline
    phase: BASELINE
    action: hiring.state.read
    outputs: [invitation.status, recruiting.stage_id, pipeline.row_version, final_decision.count, final_decision.latest_actor_type, report.api.presence, report.api.status]
    evidence_requirements: [EV-01, EV-09]
  - step_id: apply-reporting-fault
    phase: INJECTED
    action: reporting.fault.inject
    outputs: [fault.marker.applied]
    evidence_requirements: [EV-02]
  - step_id: trigger-reporting
    phase: INJECTED
    action: reporting.trigger
    outputs: []
    evidence_requirements: [EV-03]
  - step_id: confirm-fault-effect
    phase: INJECTED
    action: reporting.fault.probe
    outputs: [fault.effect.receipt_match]
    evidence_requirements: [EV-03]
  - step_id: observe-report
    phase: INJECTED
    action: reporting.status.read
    attempt_policy: {max_attempts: 15, backoff_seconds: 2}
    outputs: [report.api.presence, report.api.status]
    evidence_requirements: [EV-03]
  - step_id: observe-company-console
    phase: INJECTED
    action: reporting.ui.observe
    outputs: [report.ui.ready_content_visible, report.ui.status_class]
    evidence_requirements: [EV-04]
  - step_id: attempt-final-decision
    phase: INJECTED
    action: hiring.final_decision.attempt
    outputs: [decision.attempt.accepted, decision.attempt.reason_present, decision.attempt.reason_code]
    evidence_requirements: [EV-05]
  - step_id: capture-post-decision-state
    phase: INJECTED
    action: hiring.state.read
    outputs: [invitation.status, recruiting.stage_id, pipeline.row_version, final_decision.count, final_decision.latest_actor_type]
    evidence_requirements: [EV-06]
  - step_id: observe-automatic-decision-window
    phase: INJECTED
    action: hiring.decision_history.read
    attempt_policy: {max_attempts: 5, backoff_seconds: 2}
    outputs: [invitation.status, recruiting.stage_id, pipeline.row_version, final_decision.count, final_decision.latest_actor_type]
    evidence_requirements: [EV-07]
  - step_id: restore-environment
    phase: RECOVERED
    action: reporting.fault.restore
    outputs: [fault.environment_restore, report.processing_recovery]
    evidence_requirements: [EV-08]
    always_run: true

assertions:
  - assertion_id: H03-A1
    description: reporting 장애가 현재 Run과 대상 session에서 실제 발동했다.
    expectation: {fault.marker.applied: true, fault.effect.receipt_match: true}
    required_observation_keys: [fault.marker.applied, fault.effect.receipt_match]
    required_evidence_ids: [EV-02, EV-03]
    source_requirements: [FR-016, FR-017]
  - assertion_id: H03-A2
    description: 리포트 미준비 상태와 최종 실패 또는 장기 지연이 담당자에게 드러난다.
    expectation: {report.api.presence: ABSENT, report.ui.ready_content_visible: false, report.ui.status_class: failed_or_delayed}
    fail_condition: {report.ui.status_class: queued_only}
    required_observation_keys: [report.api.presence, report.api.status, report.ui.ready_content_visible, report.ui.status_class]
    required_evidence_ids: [EV-03, EV-04]
    source_requirements: [FR-027, FR-028, FR-029]
  - assertion_id: H03-A3
    description: 정상 최종결정 시도가 대상이 제공한 리포트 부재 이유와 함께 거부된다.
    expectation: {decision.attempt.accepted: false, decision.attempt.reason_present: true, decision.attempt.reason_code: REPORT_NOT_AVAILABLE}
    required_observation_keys: [decision.attempt.accepted, decision.attempt.reason_present, decision.attempt.reason_code]
    required_evidence_ids: [EV-05]
    source_requirements: [FR-030, FR-031]
  - assertion_id: H03-A4
    description: 거부된 결정 시도가 결정 기록·채용 단계·지원 건 상태를 바꾸지 않는다.
    expectation: {state_matches_baseline: true}
    required_observation_keys: [invitation.status, recruiting.stage_id, pipeline.row_version, final_decision.count, final_decision.latest_actor_type]
    required_evidence_ids: [EV-01, EV-06]
    source_requirements: [FR-032]
  - assertion_id: H03-A5
    description: 장애 구간에 사람 요청 없는 자동 최종결정이 없다.
    expectation: {final_decision.count: 0, final_decision.latest_actor_type: null}
    required_observation_keys: [invitation.status, recruiting.stage_id, pipeline.row_version, final_decision.count, final_decision.latest_actor_type]
    required_evidence_ids: [EV-07]
    source_requirements: [FR-033]
  - assertion_id: H03-A6
    description: marker가 비활성화되고 worker가 정상인 안전한 환경으로 복구된다.
    expectation: {fault.environment_restore: SUCCEEDED}
    required_observation_keys: [fault.environment_restore, report.processing_recovery]
    required_evidence_ids: [EV-08]
    source_requirements: [FR-018, FR-019, FR-020]

required_evidence:
  - {evidence_id: EV-01, description: 장애 전 상태 기준선, artifact_types: [STATE_SNAPSHOT]}
  - {evidence_id: EV-02, description: 장애 적용 요청과 결과, artifact_types: [FAULT_RECEIPT]}
  - {evidence_id: EV-03, description: 일치하는 worker trigger receipt와 report 상태, artifact_types: [FAULT_RECEIPT, HTTP_EXCHANGE]}
  - {evidence_id: EV-04, description: 담당자 화면과 visible text, artifact_types: [SCREENSHOT, BROWSER_PROJECTION]}
  - {evidence_id: EV-05, description: 최종결정 요청과 응답, artifact_types: [HTTP_EXCHANGE]}
  - {evidence_id: EV-06, description: 결정 시도 후 상태, artifact_types: [STATE_SNAPSHOT]}
  - {evidence_id: EV-07, description: 자동결정 부재 관찰 창, artifact_types: [STATE_SNAPSHOT]}
  - {evidence_id: EV-08, description: 환경 복구와 별도 리포트 처리 결과, artifact_types: [FAULT_RECEIPT, STATE_SNAPSHOT]}
  - {evidence_id: EV-09, description: 시나리오와 canonical 대상 snapshot, artifact_types: [VERSION_SNAPSHOT]}

timing_policy:
  poll_seconds: 2
  injected_deadline_seconds: 30
  automatic_decision_window_seconds: 10
  environment_restore_deadline_seconds: 120
  stability_consecutive: 3
  stability_seconds: 4

restore_policy:
  mandatory: true
  action: reporting.fault.restore
  report_processing_result_field: report.processing_recovery

observation_comparators:
  fault.marker.applied: {kind: EXACT, value_type: boolean}
  fault.effect.receipt_match: {kind: EXACT, value_type: boolean}
  report.api.presence: {kind: EXACT, value_type: string}
  report.api.status: {kind: EXACT, value_type: string}
  report.ui.ready_content_visible: {kind: EXACT, value_type: boolean}
  report.ui.status_class: {kind: EXACT, value_type: string}
  decision.attempt.accepted: {kind: EXACT, value_type: boolean}
  decision.attempt.reason_present: {kind: EXACT, value_type: boolean}
  decision.attempt.reason_code: {kind: EXACT, value_type: string}
  invitation.status: {kind: EXACT, value_type: string}
  recruiting.stage_id: {kind: EXACT, value_type: string}
  pipeline.row_version: {kind: EXACT, value_type: integer}
  final_decision.count: {kind: EXACT, value_type: integer}
  final_decision.latest_actor_type: {kind: EXACT, value_type: string}
  fault.environment_restore: {kind: EXACT, value_type: string}
  report.processing_recovery: {kind: EXACT, value_type: string}

source_requirements: [FR-001, FR-002, FR-015, FR-034, FR-055]
allowed_model_fixtures:
  h03-report-v1: ce09b95403b34e1390502c90f5c5edc518ddf65d38c8ce881617a37cac6d16b1
excluded_scope:
  - reporting retry exhaustion and DLQ
  - generic Kanban or batch stage-move bypass
  - post-recovery idempotency
  - Outbox and decision-history completeness

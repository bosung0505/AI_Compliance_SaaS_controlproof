id: H-03
control: 인간 개입 및 안전한 예외처리
name: Reporting 장애 시 실패 노출·결정 차단·DLQ 보존

intent: |
  사람의 검토에 필요한 자료가 만들어지지 않은 상태에서, 시스템이 그 사실을
  담당자에게 드러내고 결정을 차단해야 한다. 실패한 작업은 조용히 사라지지 않고
  기록으로 남아야 하며, 실패한 결정 시도가 일부만 저장되어 화면과 데이터가
  어긋나는 상태를 남기지 않아야 한다.

legal_basis:
  - AI 기본법 제34조 제1항 (사람의 관리·감독)

implementation:
  target: WhyYou
  version_ref: git rev-parse HEAD
  notes: |
    reporting 큐는 사람 검토 대기자 목록이 아니라 면접 분석 결과를 최종
    리포트로 만드는 비동기 처리 경로다 (기능범위 6.3).
    최종결정은 세 가지가 한 트랜잭션으로 함께 일어난다.
      1) HumanReview(final_decision) 저장 — COMPANY_USER 전용, 사유 필수
      2) 채용 단계 이동 — expected_pipeline_version 사용
      3) 지원 건 상태 전이 completed → reviewed
         idempotency_key = f"invitation-reviewed-{invitation_id}"
    close_invitation_review 는 오류를 의도적으로 전파한다. HTTP 트랜잭션이
    셋을 함께 롤백하기 위한 설계이며, 이 시나리오는 그 설계가 실제로
    지켜지는지 시험한다.
    애플리케이션 JobStatus.DLQ 와 인프라 SQS DLQ 를 구분해 관찰한다.

beneficiary: 지원자
initiator: 담당자

seed: state
adapters: [api, log, fault]
injection: [장애 주입]

preconditions:
  - step: 면접 완료 후 리포트 생성이 비동기로 수행됨
    required: true
    status: present
    evidence: "Outbox → SQS reporting 큐 → ECS Worker"
  - step: 사람 전용 최종결정 경로 존재
    required: true
    status: present
    evidence: "reporting/application/review_service.py :: record_final_decision"
  - step: 지원 건 상태 전이 (completed → reviewed)
    required: true
    status: present
    evidence: "review_service.py :: close_invitation_review"
  - step: 담당자 화면이 리포트 상태를 표시함
    required: true
    status: present
    evidence: "company-console 검토 화면"
  - step: reporting 경로를 인위적으로 실패시킬 수 있는 수단
    required: true
    status: absent
    evidence: "시험 전용 장애 주입 기능 미구현 (7.7 신규 구현 대상)"

fixtures:
  applicants:
    - ref: A1
      note: 면접 완료, 리포트 생성 대기 상태
    - ref: A2
      note: 면접 완료, 리포트 ready (대조군)
    - ref: A3
      note: 면접 완료, 리포트 생성 대기 상태
  users:
    - ref: U1
      role: 최초 결정자 (COMPANY_USER)

fault:
  kind: reporting_down
  target: |
    reporting 큐의 워커를 중단하거나 리포트 저장 직전 오류를 발생시켜
    재시도 한도를 소진시킨다. 작업이 JobStatus.DLQ 로 전환되고 메시지가
    SQS DLQ 로 이동하는 상태까지 만든다.
  restore: |
    주입을 해제하고 DLQ 메시지를 재처리한다. 지원 건 상태·채용 단계·
    row_version 이 장애 전 기준선과 일치하는지 확인한 뒤 다음 단계로 간다.

steps:
  - n: 1
    do: A1·A2·A3 을 만들고 장애 전 기준선을 기록
    via: api
    manual: false
    observe: 지원 건 상태, 채용 단계, row_version, 리포트 상태
  - n: 2
    do: reporting 경로에 장애를 주입
    via: fault
    manual: false
    observe: 주입 시각, 대상, 방식
  - n: 3
    do: 재시도 한도가 소진될 때까지 기다려 DLQ 전환을 확인
    via: log
    manual: false
    observe: 재시도 횟수, JobStatus.DLQ, SQS DLQ 메시지
  - n: 4
    do: 담당자 화면에서 A1 의 리포트 상태를 확인
    via: api
    manual: false
    observe: 화면에 표시된 상태 (처리 중과 최종 실패의 구분)
  - n: 5
    do: U1 이 A1 에 대해 최종결정(advance)을 시도
    via: api
    manual: false
    observe: 응답 코드, 오류 내용
  - n: 6
    do: 리포트 없이 일반 채용 단계 이동(칸반·일괄)으로 A1 을 확정 단계로 옮김
    via: api
    manual: false
    observe: 응답 코드, 단계 변화 여부
  - n: 7
    do: 장애 중 저장 상태를 확인
    via: log
    manual: false
    observe: HumanReview 유무, 단계 이동 기록, 상태 전이 기록, 감사·아웃박스 이벤트
  - n: 8
    do: A1·A3 이 자동으로 확정되지 않았는지 확인
    via: log
    manual: false
    observe: 사람 결정 없는 단계 이동·상태 전이 유무
  - n: 9
    do: 장애를 복구하고 DLQ 를 재처리한 뒤 기준선 일치를 확인
    via: fault
    manual: false
    observe: 복구 시각, 리포트 상태, 복원 후 상태·단계·row_version
  - n: 10
    do: U1 이 A1 에 대해 정상적으로 최종결정을 수행
    via: api
    manual: false
    observe: 결정자, 시각, 단계, 사유, 지원 건 상태
  - n: 11
    do: 동일 요청을 한 번 더 전송
    via: api
    manual: false
    observe: 최종결정 기록 수, 상태 전이 중복 여부

expected: |
  리포트 생성이 최종 실패하면 담당자 화면이 "처리 중"이 아니라 실패 상태를
  보여준다. 그 상태에서는 최종결정도, 칸반·일괄 이동도 차단된다. 실패한 작업은
  재시도 이력과 DLQ 기록으로 남고 조용히 사라지지 않는다. 실패한 결정 시도는
  아무것도 저장하지 않으며, 장애 중 어떤 지원자도 자동으로 확정되지 않는다.
  복구 후 사람이 결정하면 결정 기록·단계 이동·상태 전이가 함께 반영되고,
  같은 요청을 다시 보내도 결정은 한 번만 기록된다.

rules:
  - type: state_equals
    subject: report.visible_state
    equals: failed

  - type: fields_present
    source: 장애 구간의 작업 기록
    present: [job.status, sqs.dlq_message, retry.count]

  - type: state_equals
    subject: decision.response_status
    equals: 409

  - type: state_equals
    subject: stage_move.response_status
    equals: 409

  - type: state_equals
    subject: invitation.state
    equals: completed

  - type: state_equals
    subject: invitation.stage
    equals: 검토

  - type: fields_present
    source: 장애 중 저장 상태
    present: [error.record]
    absent:
      - human_review.record
      - event.stage_moved
      - event.state_transition

  - type: event_order
    before: event.stage_moved
    after: event.state_transition
    strict: false

  - type: fields_present
    source: 복구 후 정상 결정
    present: [human_review.record]

  - type: state_equals
    subject: human_review.count
    equals: 1

evidence_required:
  - 장애 전 기준선 상태·단계·row_version (API)
  - 장애 주입 시각·대상·방식 (주입 기록)
  - 재시도 횟수와 JobStatus.DLQ 전환 (로그)
  - SQS DLQ 메시지 (인프라)
  - 담당자 화면에 표시된 리포트 상태 (API·캡처)
  - 최종결정 시도의 요청·응답 (API)
  - 일반 단계 이동 시도의 요청·응답 (API)
  - 장애 중 감사·아웃박스 이벤트 (로그)
  - 장애 중 상태 변경 이력 부재 (로그)
  - 복구 시각과 복원 후 기준선 일치 (API)
  - 정상 결정의 결정자·시각·단계·사유 (HumanReview)
  - 재시도 후 결정 건수 (HumanReview)
  - 적용 버전 (commit, 평가기준 버전)

inconclusive_when:
  - reason: NO_TEST_TARGET
    when: 장애 주입 수단이 없어 DLQ 전환 상태를 만들 수 없는 경우
  - reason: INSUFFICIENT_EVIDENCE
    when: 장애 구간의 상태 변경 이력이나 오류 기록을 조회할 수 없는 경우
  - reason: EVIDENCE_CONFLICT
    when: API 응답과 로그의 상태가 서로 다르게 관찰되는 경우

defect_variant:
  available: true
  how: |
    현재 main 상태 그대로 실행하는 것이 곧 최초 시험이다. 우회·장애 대응은
    아직 보완 전이므로 FAIL 이 나오면 그것을 수정 대상으로 기록하고
    보완 후 같은 조건으로 재시험한다 (기능범위 7.3).
    최초 실행이 PASS 이면 결함 버전을 따로 만들지 않는다.
  expected_result: FAIL

status: NOT_RUN
last_run: null

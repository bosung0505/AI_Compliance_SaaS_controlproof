# =============================================================================
# ControlProof 시나리오 명세 템플릿
#
# 이 파일은 시나리오 하나를 기술하는 형식을 정의한다.
# 원칙: 시나리오는 데이터다. 시나리오가 바뀌어도 엔진 코드는 바뀌지 않는다.
#       엔진이 바뀌는 경우는 (1) 새 관찰 수단 추가 (2) 새 판정 규칙 타입 추가
#       (3) 증적 스키마 변경 뿐이다.
# =============================================================================

id: X-00                      # 통제코드-순번 (N/H/A/E - 01~03)
control: 통제 이름              # 사전 고지 | 인간 개입 | 이용자 보호·이의처리 | 증적 기록
name: 시나리오 한 줄 이름

# -----------------------------------------------------------------------------
# 1. 의도와 구현의 분리
#
# intent 는 어느 회사에서나 같다. 법 조항에서 도출하며 고객이 바뀌어도 유지된다.
# implementation 은 이 회사에서 그 의도가 어떤 기능·필드·상태로 나타나는지다.
# 고객이 바뀌면 implementation 만 교체한다. intent 를 고쳐야 한다면
# 그것은 시나리오 교체이지 매핑이 아니다.
# -----------------------------------------------------------------------------
intent: |
  통제가 무엇을 보장해야 하는가. 제품 이름·필드명·엔드포인트를 쓰지 않는다.

legal_basis:
  - AI 기본법 제34조 제1항 제N호        # 근거 조항
  - 가이드라인/내부 정책 (있으면)

implementation:
  target: WhyYou
  version_ref: git rev-parse HEAD       # 시험 시점 버전 식별 방법
  notes: |
    이 회사에서 해당 통제가 구현된 위치. 엔드포인트, 상태값, 테이블, 함수.

# -----------------------------------------------------------------------------
# 2. 수혜자와 개시자
#
# 통제가 보호하는 사람과, 그 절차를 일으키는 주체.
# 이 두 칸이 시나리오의 소속을 결정한다.
# 예: 이의처리의 수혜자·개시자는 모두 지원자다. 담당자가 자기 재량으로
#     실행하는 기능은 개시자가 담당자이므로 이의처리 시나리오가 될 수 없다.
# -----------------------------------------------------------------------------
beneficiary: 지원자 | 담당자 | 기업 | 감사자
initiator: 지원자 | 담당자 | 시스템 | 외부 트리거

# -----------------------------------------------------------------------------
# 3. 전제조건 — 통제를 단계로 쪼갠다
#
# 통제를 있다/없다로 보지 않는다. 단계별로 존재 여부를 적고,
# 없는 단계만 판정 불가로 떨어뜨린다.
# status: present | absent | unknown
# 하나라도 required 이면서 absent 이면 이 시나리오는 NO_TEST_TARGET.
# -----------------------------------------------------------------------------
preconditions:
  - step: 단계 이름
    required: true
    status: present
    evidence: 이 단계가 있다고 판단한 근거 (파일 경로, 엔드포인트)

# -----------------------------------------------------------------------------
# 4. 실행 환경
#
# seed: state | path
#   state — DB에 행을 직접 생성. 리포트까지 준비된 검토 대기 지원자.
#           동의 절차를 실제로 거치지 않았으므로 고지·동의 시험에 쓸 수 없다.
#   path  — 초대 발급부터 동의까지 실제 API를 순서대로 호출.
#           면접·리포트가 없으므로 검토·결정 시험에 쓸 수 없다.
#
# adapters: api | log | browser | mail | fault
# -----------------------------------------------------------------------------
seed: state
adapters: [api, log]

fixtures:
  applicants:
    - ref: A1
      note: 이 지원자가 무엇을 대표하는가 (점수대, 상태 등)
  users:
    - ref: U1
      role: 최초 결정자

# -----------------------------------------------------------------------------
# 5. 주입 조건
#
# 정상 기준선에서 무엇을 인위적으로 바꾸는가. 없으면 fault: none.
# 주입은 격리 환경·합성 데이터·테스트 계정에서만 적용한다.
# -----------------------------------------------------------------------------
fault:
  kind: none | decision_path_down | report_read_down | audit_event_drop | state_change_drop
  target: 무엇을 막는가
  restore: 어떻게 원상복구하는가

# -----------------------------------------------------------------------------
# 6. 실행 단계
#
# 사람이 수행하는 단계가 있으면 manual: true 로 표시한다.
# 표시하지 않으면 "같은 조건 재시험"이 성립하지 않는다.
# -----------------------------------------------------------------------------
steps:
  - n: 1
    do: 무엇을 하는가
    via: api | log | browser | mail | fault
    manual: false
    observe: 이 단계에서 무엇을 관찰해 증적으로 남기는가

# -----------------------------------------------------------------------------
# 7. 기대 결과와 판정 규칙
#
# 판정 규칙은 네 타입뿐이다. 새 시나리오가 이 넷으로 표현되지 않으면
# 그때 다섯 번째 타입을 추가한다 (엔진 변경 사유 (2)).
#
#   state_equals   — 관찰한 상태값이 기대값과 같은가
#   event_order    — 사건 A가 사건 B보다 먼저인가 (strict / non_strict)
#   time_limit     — 정해진 시간 안에 일어났는가
#   fields_present — 있어야 할 필드·기록이 모두 있는가 (없어야 할 것은 absent)
#
# 모든 규칙이 pass 여야 PASS. 하나라도 어긋나면 FAIL.
# 규칙을 평가할 관찰값 자체를 얻지 못하면 INCONCLUSIVE.
# -----------------------------------------------------------------------------
expected: |
  사람이 읽는 기대 결과. 비개발자가 이해할 수 있게 쓴다.

rules:
  - type: state_equals
    subject: 무엇의 상태
    equals: 기대값

  - type: event_order
    before: 먼저 일어나야 할 사건
    after: 나중에 일어나야 할 사건
    strict: true

  - type: time_limit
    from: 시작 사건
    to: 종료 사건
    within: 5m

  - type: fields_present
    source: 어느 기록에서
    present: [반드시 있어야 할 필드]
    absent: [있으면 안 되는 기록]

# -----------------------------------------------------------------------------
# 8. 필수 증적
#
# 한 기록에 다 있을 필요는 없다. 여러 원본을 실행 ID로 묶어
# 하나의 증적 묶음으로 재구성할 수 있으면 된다.
# -----------------------------------------------------------------------------
evidence_required:
  - 항목 이름 (수집 출처)

# -----------------------------------------------------------------------------
# 9. 판정 불가 조건
#
# reason 코드:
#   NO_TEST_TARGET   — 대상 기능 자체가 없음
#   NO_ACCESS        — 접근 권한·경로가 없어 관찰 불가
#   EVIDENCE_MISSING — 판정에 필요한 증적을 얻지 못함
#   CONFLICT         — 관찰 결과가 서로 충돌
# -----------------------------------------------------------------------------
inconclusive_when:
  - reason: NO_ACCESS
    when: 어떤 상황일 때

# -----------------------------------------------------------------------------
# 10. 결함 버전 — FAIL → 수정 → PASS 시연용
#
# 정상 기준선에서 무엇을 끄면 이 시나리오가 실패하는가.
# 시험 대상을 새로 만드는 것이 아니라, 이미 있는 통제를 끄는 것이다.
# 대상에 없는 기능을 만들어 넣지 않는다.
# -----------------------------------------------------------------------------
defect_variant:
  available: true | false
  how: 무엇을 끄거나 바꾸면 실패하는가
  expected_result: FAIL

# -----------------------------------------------------------------------------
# 11. 실행 상태 (엔진이 갱신)
# -----------------------------------------------------------------------------
status: NOT_RUN               # NOT_RUN | PASS | FAIL | INCONCLUSIVE
last_run: null

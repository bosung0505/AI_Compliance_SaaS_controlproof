# ControlProof MVP 12-scenario catalog (Spec 005, contracts/catalog.md).
# Derived from the scope matrix; tests/unit/test_catalog_matrix_parity.py keeps it 12/12 with the matrix.
# Official records are copied from each Spec's validation.md. Policy basis carries no legal articles (FR-009).
schema_version: controlproof.catalog.v1
source: docs/product/ControlProof_MVP_Scenario_Coverage_Matrix.md
fixed_scope_sentence: >-
  ControlProof MVP는 12개 시나리오를 한 화면에서 관리한다. 이 가운데 5개는 실제 실행과 증적을
  제공하고, 4개는 이번 실행 범위 밖인 `NOT_RUN`, 3개는 대상 기능이 없는 `NO_TEST_TARGET`로
  사실대로 구분한다.
controls:
  - {control: N, control_label: 고지·동의 (N)}
  - {control: H, control_label: 사람 결정 (H)}
  - {control: E, control_label: 근거·기록 (E)}
  - {control: A, control_label: 이의제기 (A)}
scenarios:
  # ------------------------------------------------------------------ N
  - id: N-01
    control: N
    control_label: 고지·동의 (N)
    question: PC·모바일에서 필수 AI 고지가 보이는가
    mvp_treatment: NOT_RUN
    owner_spec: Spec 005 카탈로그
    target_exists: true
    profiles: []
    official_status:
      result: NOT_RUN
      summary: 이번 2주 MVP 범위에서 실행하지 않음
      validation_ref: docs/product/ControlProof_MVP_Scenario_Coverage_Matrix.md
      records: []
    explanation:
      intent: {text: "지원자가 자료를 내고 AI 처리가 시작되기 전에 AI 평가 보조·사람의 최종 결정·녹화와 개인정보 처리 내용을 읽을 수 있게 확인했는지 본다.", source: "V4 §10.1 N-01"}
      protected_object: {text: "지원자가 동의 전에 알아야 할 고지 내용과 그 동의 기록", source: "V4 §10.1 N-01"}
      policy_basis: {text: "내부 통제 기준: AI 처리 전에 필수 고지를 읽을 수 있는 형태로 보인다. · 시나리오 근거: V4 §10.1 N-01", source: "V4 §10.1"}
      not_run_reason: {text: "대상 기능은 있지만 이번 MVP는 실행 범위를 5개로 정했고 이 시나리오의 실행기는 만들지 않았다.", source: "범위표 §2·§3, Decision Log D-013·D-014"}
      follow_up_condition: {text: "PC·모바일 화면 확인 실행기와 정책 버전 연결 증적 계약을 별도 Spec에서 정하고 제품 책임자가 범위 확대를 결정하면 실행한다.", source: "범위표 §4 규칙 5"}
  - id: N-02
    control: N
    control_label: 고지·동의 (N)
    question: 동의 완료 전에 분석·녹화·평가가 시작되지 않는가
    mvp_treatment: EXECUTED
    owner_spec: Spec 003
    target_exists: true
    profiles:
      - execution_profile: N02_CONSENT_ORDER_V1
        scenario_file: scenarios/N-02.yaml
        run_command: python -m engine.cli run N-02 --profile N02_CONSENT_ORDER_V1 --target {target} --label {label} --json
        retest_command: python -m engine.cli retest {parent_run_id} --target {target} --label {label} --json
    official_status:
      result: INCONCLUSIVE
      reason_code: INSUFFICIENT_EVIDENCE
      note: A5·A7
      summary: 재시험에서 A1~A4·A6 통과, A5·A7은 격리 대상에서 문서 분석 결과를 확인할 수 없어 판정 불가
      validation_ref: specs/003-n02-consent-order/validation.md
      records:
        - {role: parent, execution_profile: N02_CONSENT_ORDER_V1, run_id: 15cef078-ee24-4f0e-91ef-381e0f7a1cc2, result: INCONCLUSIVE, manifest_sha256: d2306f3cd6e2b15ce87d94e4844a2278c7ea3c0b3c052a2aac45e1bff8f2bc9b}
        - {role: final, execution_profile: N02_CONSENT_ORDER_V1, run_id: 7b59237e-0a96-403a-9add-28b91011e950, result: INCONCLUSIVE, manifest_sha256: 2a0e7862d103a5702b5102ea2564a8077f8ed84eb71e6de52719877e9c996f28}
    explanation:
      intent: {text: "실제 처리 순서가 동의 → 제출 → 분석·녹화·평가로 지켜지는지, 동의 기록이 저장되지 않았을 때도 후속 처리가 막히는지 본다.", source: "V4 §10.2 N-02"}
      failure_impact: {text: "화면상 고지는 있어도 실제 분석·녹화·평가가 동의보다 먼저 시작되거나, 동의 저장이 실패했는데도 처리가 진행돼 동의 없는 처리가 생길 수 있다.", source: "V4 §10.2 N-02 실패 의미"}
      protected_object: {text: "지원자의 동의 여부와 그 동의에 기대는 문서 분석·녹화·AI 평가의 시작", source: "V4 §10.2 N-02"}
      policy_basis: {text: "내부 통제 기준: 저장된 동의 기록이 있을 때만 분석·녹화·평가를 시작한다. · 시나리오 근거: V4 §10.2 N-02", source: "V4 §10.2"}
      implementation_location: {text: "지원자가 동의를 마치는 단계와, 그 뒤 문서 분석·녹화·AI 평가를 시작하는 서버 처리", source: "docs/research/Spec003_N02_WhyYou_Source_Baseline.md"}
      synthetic_data: {text: "합성 지원자를 경로별로 따로 두고, 동의 전 우회 시도·정상 순서·동의 저장 실패를 각각 시험한다.", source: "specs/003-n02-consent-order/spec.md"}
      manual_steps:
        - {text: "공식 실행 전 사람의 실행 승인", source: AGENTS.md}
        - {text: "복구 실패 시 사람이 정리를 확인(명령줄)", source: "specs/003-n02-consent-order/spec.md"}
  - id: N-03
    control: N
    control_label: 고지·동의 (N)
    question: 진행 중 정책 버전·본문 해시가 바뀌면 기존 동의가 무효화되는가
    mvp_treatment: NOT_RUN
    owner_spec: Spec 005 카탈로그
    target_exists: true
    profiles: []
    official_status:
      result: NOT_RUN
      summary: 이번 2주 MVP 범위에서 실행하지 않음
      validation_ref: docs/product/ControlProof_MVP_Scenario_Coverage_Matrix.md
      records: []
    explanation:
      intent: {text: "지원자가 읽은 정책과 서버에 기록된 동의 정책이 정책 교체 구간에서도 일치하는지 본다.", source: "V4 §10.3 N-03"}
      protected_object: {text: "지원자가 실제로 읽고 동의한 정책 버전과 본문 해시", source: "V4 §10.3 N-03"}
      policy_basis: {text: "내부 통제 기준: 동의 기록은 지원자가 실제로 확인한 정책 버전에 귀속된다. · 시나리오 근거: V4 §10.3 N-03", source: "V4 §10.3"}
      not_run_reason: {text: "정책 교체를 시험 중에 일으키는 변경 주입 capability가 없고 이번 MVP 실행 범위에 들지 않았다.", source: "범위표 §3"}
      follow_up_condition: {text: "정책 교체 주입과 되돌림 capability, 화면 값과 저장 값 대조 증적 계약이 생기고 범위 확대가 결정되면 실행한다.", source: "범위표 §3·§4 규칙 5"}
  # ------------------------------------------------------------------ H
  - id: H-01
    control: H
    control_label: 사람 결정 (H)
    question: 권한 없는 주체가 최종 결정을 확정할 수 없는가
    mvp_treatment: NOT_RUN
    owner_spec: Spec 005 카탈로그
    target_exists: true
    profiles: []
    official_status:
      result: NOT_RUN
      summary: 이번 2주 MVP 범위에서 실행하지 않음
      validation_ref: docs/product/ControlProof_MVP_Scenario_Coverage_Matrix.md
      records: []
    explanation:
      intent: {text: "최종 채용 결정을 사람인 회사 사용자만 기록할 수 있고 AI 어시스턴트·백그라운드 작업·지원자는 같은 명령을 실행할 수 없는지 본다.", source: "V4 §10.4 H-01"}
      protected_object: {text: "사람만 내려야 하는 최종 채용 결정과 그 기록", source: "V4 §10.4 H-01"}
      policy_basis: {text: "내부 통제 기준: 최종 채용 결정은 권한 있는 사람만 확정한다. · 시나리오 근거: V4 §10.4 H-01", source: "V4 §10.4"}
      not_run_reason: {text: "기존 권한 검사는 대상 서비스에 있으나 이번 MVP 실행 범위를 5개로 정해 실행기를 만들지 않았다.", source: "범위표 §3"}
      follow_up_condition: {text: "주체별 호출 실행기와 거부·무변경 증적 계약을 별도 Spec에서 정하고 범위 확대가 결정되면 실행한다.", source: "범위표 §4 규칙 5"}
  - id: H-02
    control: H
    control_label: 사람 결정 (H)
    question: AI 어시스턴트가 최종 채용 상태를 바꿀 수 없는가
    mvp_treatment: NOT_RUN
    owner_spec: Spec 005 카탈로그
    target_exists: true
    profiles: []
    official_status:
      result: NOT_RUN
      summary: 이번 2주 MVP 범위에서 실행하지 않음
      validation_ref: docs/product/ControlProof_MVP_Scenario_Coverage_Matrix.md
      records: []
    explanation:
      intent: {text: "최종 채용 상태를 바꾸는 명령이 AI 어시스턴트의 도구 목록과 백그라운드 작업의 처리 계약에 애초에 없는지 본다.", source: "V4 §10.5 H-02"}
      protected_object: {text: "채용 상태를 바꿀 수 있는 기능 표면", source: "V4 §10.5 H-02"}
      policy_basis: {text: "내부 통제 기준: AI에는 조회·보조 기능만 둔다. · 시나리오 근거: V4 §10.5 H-02", source: "V4 §10.5"}
      not_run_reason: {text: "도구·처리 계약 목록을 읽는 정적 검사 실행기가 없고 이번 MVP 실행 범위에 들지 않았다.", source: "범위표 §3"}
      follow_up_condition: {text: "기능 표면 목록 수집과 읽기·쓰기 구분 증적 계약이 정해지고 범위 확대가 결정되면 실행한다.", source: "범위표 §4 규칙 5"}
  - id: H-03

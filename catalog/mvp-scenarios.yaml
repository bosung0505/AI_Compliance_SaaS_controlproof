        - {role: repeat, execution_profile: E01_CITATION_EVIDENCE_V1, run_id: 4030503c-a24c-42f9-b926-7aba49b4c467, result: PASS, manifest_sha256: 3c35ba8e682ac47b62e50dd981611cde37ec28a31ab14effd3074617d8a530ec}
    explanation:
      intent: {text: "AI가 낸 점수가 근거가 되는 답변 인용 없이 저장되거나 보이지 않는지, 근거가 사라지면 그 점수가 정상처럼 보이지 않는지 본다.", source: "specs/004-e01-e02-score-evidence/spec.md Feature Goal"}
      failure_impact: {text: "근거가 없거나 다른 지원자의 근거를 가리키는 점수가 정상 점수처럼 보여 평가 결과를 설명할 수 없다. 근거가 사라진 뒤에도 점수만 남으면 검토자가 확인할 수 없는 숫자를 믿게 된다.", source: "V4 §10.10 E-01 실패 의미"}
      protected_object: {text: "지원자 평가 점수와 그 근거가 되는 면접 답변 구간. AI 점수는 참고 정보이며 최종 채용 결정은 권한 있는 사람이 한다.", source: "V4 §10.10 E-01"}
      policy_basis: {text: "내부 통제 기준: AI 점수는 확인 가능한 근거와 함께만 저장·표시한다. · 시나리오 근거: V4 §10.10 E-01", source: "V4 §10.10"}
      implementation_location: {text: "면접이 끝난 뒤 리포트를 만드는 단계에서 AI가 인용한 답변이 그 지원자·그 기준의 답변인지 확인하는 곳과, 회사 담당자가 리포트를 여는 화면", source: "docs/research/Spec004_E01_E02_WhyYou_Source_Baseline.md"}
      synthetic_data: {text: "합성 지원자 4명(인용 시험·근거 제거·저장소 진단·대조군). 대조군 리포트는 시험 전후 바뀌지 않아야 한다.", source: "specs/004-e01-e02-score-evidence/spec.md"}

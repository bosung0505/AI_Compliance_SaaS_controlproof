        - {role: final, execution_profile: H03_MINIMAL_V1, run_id: e42482c9-ba84-42c6-984d-209e0f80b7d8, result: PASS, validation_ref: specs/001-execution-evidence-h03/validation.md, bundle_digest: 213f11a4f37dfb4108443d4dd122e6c75b4f96578efe671d074a8b38053baec0}
        - {role: parent, execution_profile: H03_DLQ_V2, run_id: 60b19e5a-6693-427b-bf87-039e45181cfc, result: FAIL, manifest_sha256: 40602160bcc9b6c534dcd0c582ec6dc39f2c5fe8b23455ba15760494d9193fec}
        - {role: final, execution_profile: H03_DLQ_V2, run_id: 3ff1c0c7-7937-4d0a-996c-de4d63f4f1af, result: PASS, manifest_sha256: 567f36281c23a1fa081e6a2113d5099e13d3af54f0d9cb3c919db156f683d285}
    explanation:
      intent: {text: "리포트 생성이 실패해도 담당자에게 실패가 드러나고, 리포트 없이 채용 결정을 확정할 수 없으며, 실패 건이 조용히 사라지지 않는지 본다.", source: "V4 §10.6 H-03"}
      failure_impact: {text: "담당자가 리포트 실패를 모른 채 결정하거나 일반 단계 이동으로 보호 규칙을 우회할 수 있고, 실패 건이 운영자에게 보이지 않거나 재시도에서 중복이 생길 수 있다.", source: "V4 §10.6 H-03 실패 의미"}
      protected_object: {text: "리포트에 기대는 사람의 최종 결정과 실패한 리포트 작업의 추적 가능성", source: "V4 §10.6 H-03"}
      policy_basis: {text: "내부 통제 기준: 근거 리포트 없이 최종 결정을 확정하지 않고 실패는 숨기지 않는다. · 시나리오 근거: V4 §10.6 H-03", source: "V4 §10.6"}
      implementation_location: {text: "면접 뒤 리포트를 만드는 작업 대기열과 실패 보관함, 담당자 화면의 리포트 상태 표시, 최종 결정과 채용 단계 이동 처리", source: "specs/002-h03-e03-fault-expansion/spec.md"}
      synthetic_data: {text: "면접 분석은 끝났지만 리포트가 없는 합성 지원자로 리포트 생성 실패를 일으키고, 모든 결정 경로를 시도한다.", source: "specs/002-h03-e03-fault-expansion/spec.md"}

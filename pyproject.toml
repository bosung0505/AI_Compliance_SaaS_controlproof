[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlproof"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pyyaml>=6.0", "httpx>=0.27", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".specify", ".agents"]

[tool.setuptools.packages.find]
include = ["engine*", "seeds*"]
exclude = ["tests*", "specs*", "scenarios*", "docs*"]

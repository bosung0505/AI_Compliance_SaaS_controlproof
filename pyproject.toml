[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlproof"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "playwright>=1.55",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
controlproof = "engine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".specify",
    ".agents",
    # Legacy E-series spike retained verbatim; Spec 001 does not rewrite its fixture format.
    "seeds/state_seed.py",
    "tests/test_state_seed.py",
]

[tool.setuptools.packages.find]
include = ["engine*", "seeds*"]
exclude = ["tests*", "specs*", "scenarios*", "docs*"]
